<header class="mx-auto max-w-[1200px] px-5 md:px-10">
  <nav class="flex items-center justify-between py-6 md:py-8" aria-label="Main navigation">
    <div class="flex items-center gap-3 md:gap-4">
      <img src="{{ url_for('static', path='images/hulmalogo.png') }}" alt="Hulma logo" class="h-10 w-10 object-contain" />
      <span class="text-[28px] font-bold tracking-tight text-black">Hulma</span>
    </div>

    <div class="hidden items-center gap-8 md:flex">
      <a href="#" class="nav-link text-base font-medium text-black transition-colors duration-300 hover:text-[#4169E1]">Templates</a>
      <a href="#" class="nav-link text-base font-medium text-black transition-colors duration-300 hover:text-[#4169E1]">AI Review</a>
      <a href="#" class="nav-link text-base font-medium text-black transition-colors duration-300 hover:text-[#4169E1]">About</a>
      <a href="#" class="nav-link text-base font-medium text-black transition-colors duration-300 hover:text-[#4169E1]">Help</a>
    </div>

    <div class="hidden items-center gap-3 md:flex">
      <button class="rounded-sm border border-[#6C6CE5] bg-white px-8 py-2.5 text-sm font-medium text-black transition-all duration-300 ease-out hover:-translate-y-0.5 hover:bg-[#EEF0FF] hover:shadow-md active:translate-y-0">
        Login
      </button>
      <button class="rounded-sm bg-[#4169E1] px-8 py-2.5 text-sm font-medium text-white transition-all duration-300 ease-out hover:-translate-y-0.5 hover:bg-[#2F52C4] hover:shadow-lg hover:shadow-blue-500/30 active:translate-y-0">
        Get started
      </button>
    </div>

    <button
      id="menuButton"
      type="button"
      class="inline-flex h-11 w-11 items-center justify-center rounded-md border border-slate-200 bg-white text-slate-900 shadow-sm transition-all duration-300 hover:border-slate-300 md:hidden"
      aria-label="Toggle menu"
      aria-expanded="false"
    >
      <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
        <path stroke-linecap="round" stroke-linejoin="round" d="M4 7h16M4 12h16M4 17h16" />
      </svg>
    </button>
  </nav>

  <div id="mobileMenu" class="hidden rounded-xl border border-slate-200 bg-white p-4 shadow-sm md:hidden">
    <div class="flex flex-col gap-4">
      <a href="#" class="text-base font-medium text-black transition-colors hover:text-[#4169E1]">Templates</a>
      <a href="#" class="text-base font-medium text-black transition-colors hover:text-[#4169E1]">AI Review</a>
      <a href="#" class="text-base font-medium text-black transition-colors hover:text-[#4169E1]">About</a>
      <a href="#" class="text-base font-medium text-black transition-colors hover:text-[#4169E1]">Help</a>
      <div class="mt-2 flex gap-3">
        <button class="flex-1 rounded-sm border border-[#6C6CE5] bg-white px-5 py-2.5 text-sm font-medium text-black transition-all duration-300 hover:bg-[#EEF0FF]">Login</button>
        <button class="flex-1 rounded-sm bg-[#4169E1] px-5 py-2.5 text-sm font-medium text-white transition-all duration-300 hover:bg-[#2F52C4]">Get started</button>
      </div>
    </div>
  </div>
</header>
